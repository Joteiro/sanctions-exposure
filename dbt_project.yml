name: sanctions_exposure
version: "1.0.0"
profile: sanctions_exposure

model-paths: ["models"]
analysis-paths: ["analyses"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets: ["target", "dbt_packages"]

vars:
  start_date: "2024-01-01"
  end_date: "2024-01-08"
  opensanctions_tracking_start: "2023-04-20"
  hub_degree_threshold: 1000

models:
  sanctions_exposure:
    staging:
      +materialized: table
    intermediate:
      +materialized: view
    marts:
      +materialized: table

seeds:
  sanctions_exposure:
    ofac_wallets:
      +column_types:
        wallet_id: string
        address: string
        currency: string
        holder_id: string
        first_seen: string
