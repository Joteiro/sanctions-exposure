version: 2

models:
  - name: fct_sanctioned_exposure
    description: >
      Direct exposure. One row per (transfer, sanctioned party): a transfer between two
      sanctioned addresses appears twice, once from each side.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [transfer_id, sanctioned_address]
    columns:
      - name: sanctioned_address
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_sanctioned_addresses')
                field: address
      - name: direction
        data_tests:
          - accepted_values:
              arguments:
                values: ['sent', 'received']
      - name: listing_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['already_listed', 'listed_later', 'unknown']
  - name: fct_address_exposure_hops
    description: >
      Every address within two hops of a sanctioned address, by shortest graph distance.
      Hops ignore direction and time.
    columns:
      - name: address
        data_tests: [not_null, unique]
      - name: hop_distance
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2]
                quote: false
      - name: min_via_counterparties
        description: >
          Hop 2 only. Counterparties of the least-connected hop-1 address that links this
          address to a sanctioned one. The address survives a hub filter at threshold T
          exactly when min_via_counterparties <= T.